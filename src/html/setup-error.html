<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STREEM — Setup</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.5;
    }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
    h1 { font-size: 1.4rem; }
  </style>
</head>
<body>
  <h1>STREEM backend not ready</h1>
  <p id="error-message"></p>
  <p>Run from <code>Explorer/</code>:</p>
  <pre><code>npm run setup:seamless
npm run start</code></pre>
  <p id="wsl-hint"></p>
  <p>Place model files in <code>Model/</code>:</p>
  <ul>
    <li><code>seamless_streaming_unity.pt</code></li>
    <li><code>seamless_streaming_monotonic_decoder.pt</code></li>
  </ul>
  <p id="virtual-mic-hint"></p>
  <script>
    const wslHint = document.getElementById('wsl-hint');
    if (navigator.userAgent.includes('Windows')) {
      wslHint.innerHTML =
        'On Windows the Python backend runs in <strong>WSL2</strong> (fairseq2 has no native Windows build). Install Ubuntu if needed: <code>wsl --install -d Ubuntu</code>';
    }
    const hint = document.getElementById('virtual-mic-hint');
    if (navigator.userAgent.includes('Windows')) {
      hint.textContent =
        'Virtual mic (Zoom): install VB-Audio Virtual Cable → CABLE Input as output in STREEM, CABLE Output as mic in Zoom.';
    } else {
      hint.textContent =
        'Virtual mic (Zoom): install BlackHole → pick it as translation output, then as mic in Zoom.';
    }
  </script>
</body>
</html>
