<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>STREEM — настройка</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.5;
    }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
    h1 { font-size: 1.4rem; }
  </style>
</head>
<body>
  <h1>Бэкенд STREEM не готов</h1>
  <p id="error-message"></p>
  <p>Запустите из папки <code>Explorer/</code>:</p>
  <pre><code>npm run setup:seamless
npm run start</code></pre>
  <p id="wsl-hint"></p>
  <p>Положите файлы моделей в <code>Model/</code>:</p>
  <ul>
    <li><code>seamless_streaming_unity.pt</code></li>
    <li><code>seamless_streaming_monotonic_decoder.pt</code></li>
  </ul>
  <p id="virtual-mic-hint"></p>
  <script>
    const wslHint = document.getElementById('wsl-hint');
    if (navigator.userAgent.includes('Windows')) {
      wslHint.innerHTML =
        'На Windows Python-бэкенд работает в <strong>WSL2</strong> (fairseq2 не собирается под Windows). Установите Ubuntu: <code>wsl --install -d Ubuntu</code>';
    }
    const hint = document.getElementById('virtual-mic-hint');
    if (navigator.userAgent.includes('Windows')) {
      hint.textContent =
        'Виртуальный мик (Zoom): установите VB-Audio Virtual Cable → в STREEM выберите CABLE Input, в Zoom — CABLE Output как микрофон.';
    } else {
      hint.textContent =
        'Виртуальный мик (Zoom): установите BlackHole → выберите его как вывод перевода, затем как мик в Zoom.';
    }
  </script>
</body>
</html>
